spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: book-catalog-service

  datasource:
    url: jdbc:postgresql://localhost:5432/book_catalog_db
    username: postgres
    password: ${DB_PASSWORD:default_password}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true